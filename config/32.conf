# config for sc_32_check_db_sync.sh
# see docs/db-consistency-check.md for how the comparison works

# database nodes to compare, two or three
DBSYNC_NODE[0]="${HOSTNAME_NODE1}"
DBSYNC_NODE[1]="${HOSTNAME_NODE2}"
#DBSYNC_NODE[2]=192.168.158.191

DBSYNC_PORT=3306

# rows written inside this window are excluded, so writes in flight and normal
# replication lag cannot make the nodes look different
DBSYNC_SETTLE_SECONDS=60

# a mismatch is retried before it is reported; converging means lag, not
# divergence
DBSYNC_RECHECK_TRIES=3
DBSYNC_RECHECK_DELAY=5

DBSYNC_TIMEOUT=15

# tables to compare, with the column used to bound the settle window
# leave the cutoff empty to compare the whole table
SYNCTABLE[0]=CertificateData
SYNCCUTOFF[0]=updateTime

SYNCTABLE[1]=CRLData
SYNCCUTOFF[1]=thisUpdate

SYNCTABLE[2]=CAData
SYNCCUTOFF[2]=
