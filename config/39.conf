# config for sc_39_hsm_health.sh

LUNACM="/usr/safenet/lunaclient/bin/lunacm"

# LunaCM slot IDs. Set these to the application partition and HSM administrative partition on this host.
LUNA_APPLICATION_SLOT=3
LUNA_ADMIN_SLOT=4

# Maximum duration of each non-interactive LunaCM session.
LUNACM_TIMEOUT=10

# Emit WARNING when battery voltage is this close to the HSM-provided warning threshold.
BATTERY_WARNING_MARGIN_V=0.100

# Emit WARNING when system temperature is this many degrees below the HSM-provided warning threshold.
TEMPERATURE_WARNING_MARGIN_C=5

# Partition storage thresholds, expressed as percentage free.
STORAGE_WARNING_FREE_PERCENT=15
STORAGE_ERROR_FREE_PERCENT=5
