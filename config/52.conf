# config for sc_52_scep.sh
TIMEOUT=30
RETRIES=1
CHECKTOOL=python3

# python3 + openssl are the only dependencies (no sscep, no pip packages)
PYTHON_BIN="/usr/bin/python3"
OPENSSL_BIN="/usr/bin/openssl"
SCEP_CLIENT="/opt/syscheck/lib/scep_client.py"

# SCEP_SUBJECT:    %TS% is replaced with epoch seconds (unique DN every run)
# SCEP_EXPECT:     success = must be issued, failure = must be rejected (negative test)
# SCEP_RENEW:      1 = after a successful enrollment, renew with the new cert as signer
# SCEP_EXTRA_OPTS: extra scep_client.py options, e.g.
#                  "--digest sha256 --cipher aes128"   force algorithms (default: from GetCACaps)
#                  "--tls-cafile /opt/syscheck/cert/ca-bundle.pem"  for https URLs
#                  "--max-polls 6 --poll-interval 10"   wait for manual approval (PENDING)
#                  "--san DNS:host.example.com"         add a subjectAltName

# normal enrollment (example URLs below are Nexus PGWY SCEP endpoints)
 SCEP_NAME[0]="scep"
 SCEP_URL[0]="http://192.168.0.1:8080/pgwy/scep"
 SCEP_CHALLENGE[0]="testing1337"
 SCEP_SUBJECT[0]="/CN=syscheck-scep-%TS%"
 SCEP_EXPECT[0]="success"
 SCEP_RENEW[0]=1
 SCEP_EXTRA_OPTS[0]=""
#
# negative test: wrong challenge password must be rejected
# SCEP_NAME[1]="scep-badpw"
# SCEP_URL[1]="http://192.168.0.1:8080/pgwy/scep/changeme"
# SCEP_CHALLENGE[1]="wrong-password"
# SCEP_SUBJECT[1]="/CN=syscheck-scep-badpw-%TS%"
# SCEP_EXPECT[1]="failure"
# SCEP_RENEW[1]=0
# SCEP_EXTRA_OPTS[1]=""
