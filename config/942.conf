# config for 942_restore_mysql_db_from_s3.sh

# S3 destinations to download the backup from are reused from
# config/941.conf (S3_ENDPOINT/S3_REGION/S3_BUCKET/S3_ACCESS_KEY/S3_SECRET_KEY),
# select which one with -i|--index (default 0)

# optional: passphrase file for the PGP private key used to decrypt
# encrypted (*.gpg) backups. Leave empty if the key has no passphrase or
# if gpg-agent/pinentry should be allowed to prompt for it interactively.
PGP_PASSPHRASE_FILE=

# end config #
