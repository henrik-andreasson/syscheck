#config for sc_10_ocsp.sh

TIMEOUT=10
RETRIES=1

CHECKTOOL=openssl

# warn (40 days) 40*24*60 = 57600
WARN_OCSP_RESPONDER_CERT_EXPIRE=57600

# err (20 days)
ERROR_OCSP_RESPONDER_CERT_EXPIRE=28800

# Each entry is a DIRECTORY of test certificates plus the URL of the responder
# to ask. Files inside the directory must follow this naming - it is how the
# check finds them and learns which answer to expect:
#
#   test_<name>_cert_<expected-status>.pem   the certificate to ask about
#   test_<name>_issuer.pem                   its issuer
#   test_<name>_cacerts.pem                  chain used to verify the response
#
# <expected-status> is good, revoked or unknown. One directory can hold many
# test_<name>_* sets and every one of them is queried.
#
# OCSP_TEST[0]="/opt/syscheck/etc/ocsp-tests"
# OCSP_URL[0]="http://localhost/ocsp"
#
# OCSP_TEST[1]="/opt/syscheck/etc/ocsp-tests-customer2"
# OCSP_URL[1]="http://ocsp.customer2.com/ocsp"
