# config for sc_51_nexus_acme.sh
TIMEOUT=30
RETRIES=1
CHECKTOOL=certbot

# path to certbot binary (override if not on default PATH for cron)
CERTBOT_BIN="/usr/bin/certbot"

# one ACME domain/PGWY instance to test enrollment against
 ACME_DOMAIN[0]="hej.test.se"
 ACME_EMAIL[0]="test@test.se"
 ACME_SERVER[0]="https://192.168.0.1:8443/pgwy/acme/directory"
 ACME_EAB_KID[0]="Test-1337"
 ACME_EAB_HMACKEY[0]="changeme"
 ACME_HTTP_PORT[0]=80
