# config for 941_make_mysql_db_backup_and_transfer_to_s3.sh


SUBDIR_DEFAULT=default
SUBDIR_DAILY=daily
SUBDIR_WEEKLY=weekly
SUBDIR_MONTHLY=monthly
SUBDIR_YEARLY=yearly

# S3 (or S3 compatible, eg rustfs/minio) endpoint, including scheme
S3_ENDPOINT=https://s3.example.com

# region passed to curl --aws-sigv4, most S3 compatible services accept any value here
S3_REGION=us-east-1

S3_BUCKET=mysql-backups

# prefix (folder) inside the bucket to store the backups under
S3_PREFIX=mysql

S3_ACCESS_KEY=changeme
S3_SECRET_KEY=changeme

# remove the local backup file once it has been uploaded successfully
# 1 to activate 0 to deactivate, can also be enabled per run with -r|--remove-local
REMOVE_LOCAL_BACKUP=0

# encrypt the backup with a PGP public key before uploading it
# 1 to activate 0 to deactivate, can also be enabled per run with -e|--encrypt
PGP_ENCRYPT_BACKUP=0

# path to an armored PGP public key file used to encrypt the backup
# (required when PGP_ENCRYPT_BACKUP=1 or -e|--encrypt is used)
PGP_PUBKEY_FILE=

# end config #
