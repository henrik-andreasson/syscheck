# config for 941_make_mysql_db_backup_and_transfer_to_s3.sh


SUBDIR_DEFAULT=default
SUBDIR_DAILY=daily
SUBDIR_WEEKLY=weekly
SUBDIR_MONTHLY=monthly
SUBDIR_YEARLY=yearly

# One or more S3 (or S3 compatible, eg rustfs/minio) destinations to upload
# each backup to, including scheme. Add more destinations by incrementing
# the index, all arrays below must stay the same length.
S3_ENDPOINT[0]=https://s3.example.com

# region passed to curl --aws-sigv4, most S3 compatible services accept any value here
S3_REGION[0]=us-east-1

S3_BUCKET[0]=mysql-backups

# prefix (folder) inside the bucket to store the backups under
S3_PREFIX[0]=mysql

S3_ACCESS_KEY[0]=changeme
S3_SECRET_KEY[0]=changeme

#S3_ENDPOINT[1]=https://s3-secondary.example.com
#S3_REGION[1]=us-east-1
#S3_BUCKET[1]=mysql-backups
#S3_PREFIX[1]=mysql
#S3_ACCESS_KEY[1]=changeme
#S3_SECRET_KEY[1]=changeme

# remove the local backup file once it has been uploaded successfully to
# every configured S3 destination
# 1 to activate 0 to deactivate, can also be enabled per run with -r|--remove-local
REMOVE_LOCAL_BACKUP=0

# encrypt the backup with one or more PGP public keys before uploading it
# 1 to activate 0 to deactivate, can also be enabled per run with -e|--encrypt
PGP_ENCRYPT_BACKUP=0

# one or more armored PGP public key files used to encrypt the backup. The
# backup is encrypted once, and can be decrypted by the holder of ANY of the
# listed private keys. Add more keys by incrementing the index.
# (at least one entry required when PGP_ENCRYPT_BACKUP=1 or -e|--encrypt is used)
PGP_PUBKEY_FILE[0]=

#PGP_PUBKEY_FILE[1]=

# end config #
